name: WriterApp
description: "A professional offline writer application with stats and AI tools."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # --- UI & Styling ---
  google_fonts: ^6.1.0          # Untuk font Inter dan Serif seperti di desain
  fl_chart: ^0.70.0             # Untuk grafik statistik harian/mingguan
  font_awesome_flutter: ^10.7.0 # Icon tambahan jika Material kurang lengkap
  
  # --- State Management & Database ---
  flutter_riverpod: ^2.5.1      # Untuk mengelola data aplikasi secara reaktif
  isar: ^3.1.0+1                # Database super cepat untuk folder & naskah
  isar_flutter_libs: ^3.1.0+1   # Pendukung Isar di Flutter
  path_provider: ^2.1.2         # Menemukan lokasi folder penyimpanan di HP
  
  # --- Features ---
  flutter_local_notifications: ^17.0.0 # Untuk pengingat jadwal menulis & istirahat
  intl: ^0.19.0                        # Format tanggal dan angka statistik
  share_plus: ^10.1.0                  # Untuk fitur export/share tulisan
  
  # --- Text Editor Pro ---
  flutter_quill: ^9.3.0                # Editor teks dengan fitur formatting (Bold, Italic, dll)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # --- Code Generation (Wajib untuk Isar) ---
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  # Jika nanti kamu punya gambar logo atau aset khusus
  # assets:
  #   - assets/images/
